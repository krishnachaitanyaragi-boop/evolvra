name: Build & Host Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Gradle Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/EvolvRa.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: EvolvRa-Android-APK
          path: android/app/build/outputs/apk/debug/EvolvRa.apk

      - name: Create GitHub Release & Host APK Link
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EvolvRa Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/EvolvRa.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
